# Desaladora Coquimbo V2 — Tier0 app. Build from the app dir:
#   cd /home/mariano/desaladora-coquimbo-v2/frontend && docker compose -f deploy/compose.yaml build desaladora-coquimbo-v2-ops
services:
  desaladora-coquimbo-v2-ops:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: desaladora-coquimbo-v2-ops:latest
    container_name: desaladora-coquimbo-v2-ops
    restart: unless-stopped
    env_file: ../.env
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Next standalone binds to $HOSTNAME; Docker sets it to the container id → bind all ifaces.
      - HOSTNAME=0.0.0.0
      # Origen público, para los QR de /ar-codes. Kong publica con
      # `preserve_host=false`, así que el encabezado Host que llega es el del
      # contenedor y los QR salían apuntando a `http://<contenedor>:3000/…`.
      - PUBLIC_ORIGIN=https://srv1617948.hstgr.cloud
    ports:
      - "127.0.0.1:18099:3000"
    networks:
      - tier0_edge_network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/desaladora-coquimbo-v2-ops/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s

networks:
  tier0_edge_network:
    external: true
